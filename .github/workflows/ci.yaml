on:
  pull_request:
  workflow_dispatch:
name: ci

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-15
            os: ubuntu-26.04
            cc: gcc-15
            cxx: g++-15

          - name: linux-clang-22
            os: ubuntu-26.04
            cc: clang-22
            cxx: clang++-22

          - name: linux-libc++-22
            os: ubuntu-26.04
            cc: clang-22
            cxx: clang++-22
            apt: libc++-22-dev
            bazelopts: --config libcxx

          - name: windows-msvc
            os: windows-2025

    steps:
      - run: echo "CC=${{ matrix.cc }}" >>$GITHUB_ENV && echo "CXX=${{ matrix.cxx }}" >>$GITHUB_ENV
        if: ${{ matrix.cc != '' }}
      - run: sudo apt update && sudo apt install --assume-yes --no-install-recommends ${{ matrix.apt }}
        if: ${{ matrix.apt != '' }}
      - uses: actions/checkout@v7
      - run: bazel test ... ${{ matrix.bazelopts }}

  clang-format:
    # Not ubuntu-slim as it's ubuntu-24.04-based and needs the llvm apt repo for
    # modern-ish llvm, and the llvm apt repository is pretty flaky.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends clang-format-22
      - run: find . -name "*.h" -o -name "*.cc" | xargs clang-format-22 -style=file -i
      - run: git diff --exit-code

  clang-tidy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends clang-tidy-22 libc++-22-dev
      - run: echo "CC=clang-22" >>$GITHUB_ENV && echo "CXX=clang++-22" >>$GITHUB_ENV
      - run: |
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-22 100
          sudo update-alternatives --set clang-tidy /usr/bin/clang-tidy-22
          update-alternatives --query clang-tidy
          clang-tidy --version
      - run: bazel build ... --config libcxx --config clang-tidy --keep_going

  buildifier:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - run: curl -Lo buildifier https://github.com/bazelbuild/buildtools/releases/download/v10.1.0/buildifier-linux-amd64 && sudo chmod +x buildifier
      - run: ./buildifier -lint warn -warnings all -mode diff $(find . -type f -iname "*.bazel")
